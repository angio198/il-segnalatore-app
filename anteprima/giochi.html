<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>StatsFight giochi (prova)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<!-- Prototipo da provare (09/10, richiesta utente): avatar a figura intera con vestiti, palloni e racchette
     sbloccabili, foto profilo con pose ed esultanze, e due minigiochi per StatsFight: rigori e tennis.
     Tutto in questa pagina; quando l'utente lo approva si porta in app/index.html. Dati solo su questo telefono:
     statsight.avatar2 (l'omino), statsight.giochi (vittorie e sblocchi), statsight.foto2 (la foto scattata). -->
<style>
  :root{
    --bg:#0C161C; --bg-alt:#101E25; --surface:#132029; --surface2:#1A2B35;
    --ink:#E8ECE6; --ink-soft:#A6B3B1; --line:rgba(232,236,230,0.15);
    --accent:#E8A252; --accent-strong:#F0B36B; --good:#6FBE92; --bad:#E08268; color-scheme:dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;}
  body{min-height:100vh;overscroll-behavior:none;}
  header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line);}
  header h1{font-size:1.05rem;margin:0;flex:1;font-stretch:110%;}
  header .pic{width:38px;height:38px;border-radius:50%;background:var(--surface2);overflow:hidden;flex:none;border:2px solid var(--accent);}
  header .pic img{width:100%;height:100%;display:block;}
  nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:10px 16px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;}
  nav button{border:none;background:none;color:var(--ink-soft);font:inherit;font-weight:700;font-size:0.86rem;padding:9px 0;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;}
  nav button[aria-pressed="true"]{background:var(--accent);color:#1d1205;}
  nav svg{width:22px;height:22px;}
  main{padding:0 16px 40px;max-width:560px;margin:0 auto;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px;}
  .k{color:var(--ink-soft);font-size:0.8rem;}
  canvas{display:block;width:100%;touch-action:none;border-radius:14px;}
  .stage{position:relative;}
  .cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-bottom:8px;}
  .cats button,.chip{flex:none;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font:inherit;font-size:0.82rem;font-weight:600;padding:7px 12px;border-radius:999px;cursor:pointer;}
  .cats button[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--accent);color:#1d1205;border-color:var(--accent);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;}
  .it{position:relative;border:2px solid transparent;background:var(--surface2);border-radius:12px;padding:4px 4px 6px;cursor:pointer;color:inherit;font:inherit;text-align:center;}
  .it[aria-pressed="true"]{border-color:var(--accent);}
  .it canvas{border-radius:8px;background:#0e1a20;}
  .it span{display:block;font-size:0.68rem;line-height:1.15;margin-top:3px;color:var(--ink-soft);}
  .it.lock canvas{filter:grayscale(1) brightness(.45);}
  .it .lk{position:absolute;top:6px;right:6px;width:20px;height:20px;}
  .sw{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px;}
  .sw button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;}
  .sw button[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px var(--accent);}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .primary{border:none;background:var(--accent);color:#1d1205;font:inherit;font-weight:800;padding:11px 18px;border-radius:12px;cursor:pointer;font-size:0.95rem;}
  .ghost{border:1px solid var(--line);background:var(--surface2);color:var(--ink);font:inherit;font-weight:700;padding:10px 16px;border-radius:12px;cursor:pointer;}
  .lbl{font-weight:700;font-size:0.85rem;margin:8px 0 2px;}
  input[type=text],input[type=number]{background:var(--surface2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;width:100%;}
  .hud{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 8px;gap:8px;}
  .who{display:flex;align-items:center;gap:6px;font-weight:700;font-size:0.85rem;}
  .dots{display:flex;gap:4px;margin-top:3px;} .dots i{width:11px;height:11px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);} .dots i.g{background:var(--good);} .dots i.m{background:var(--bad);}
  .big{font-size:1.6rem;font-weight:800;font-stretch:115%;font-variant-numeric:tabular-nums;}
  .help{font-size:0.8rem;color:var(--ink-soft);margin:8px 2px 0;}
  .stage{display:flex;justify-content:center;} .over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(8,14,18,.72);border-radius:14px;text-align:center;padding:16px;}
  .over b{font-size:1.5rem;font-stretch:115%;}
  .shot{position:relative;}
  .flash{position:absolute;inset:0;background:#fff;border-radius:14px;opacity:0;pointer-events:none;transition:opacity .35s;}
  .result{display:flex;gap:14px;align-items:center;margin-top:10px;}
  .result img{width:96px;height:96px;border-radius:50%;border:3px solid var(--accent);}
  .switch{display:flex;align-items:center;gap:8px;font-size:0.82rem;color:var(--ink-soft);margin-top:6px;}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-weight:700;font-size:0.88rem;z-index:20;opacity:0;transition:opacity .25s;pointer-events:none;}
  .toast.on{opacity:1;}
  .ruota{display:none;}
  @media (orientation:landscape) and (max-height:500px){ .ruota{display:block;text-align:center;padding:30px 16px;font-weight:700;} #t-rigori .stage,#t-tennis .stage,#t-rigori .hud,#t-tennis .hud{display:none;} }
  [hidden]{display:none!important;}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-avatar" viewBox="0 0 24 24"><circle cx="12" cy="6.5" r="3.6" fill="#F2C9A0"/><path d="M8.6 5.6c.4-2.4 6.4-2.6 6.9.1-1.4-.9-5.4-1-6.9-.1z" fill="#5A3A22"/><path d="M6.5 21v-6.2C6.5 12 9 10.8 12 10.8s5.5 1.2 5.5 4V21z" fill="#E8A252"/><path d="M10.6 13.5h2.8v3.4h-2.8z" fill="#fff" opacity=".9"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><rect x="2.5" y="6.5" width="19" height="13" rx="3" fill="#6FA8DC"/><path d="M8 6.5l1.4-2.5h5.2L16 6.5z" fill="#3D6E99"/><circle cx="12" cy="13" r="4.2" fill="#E8F1FA"/><circle cx="12" cy="13" r="2.4" fill="#2C4E6E"/><circle cx="18.3" cy="9.4" r="1" fill="#F7D774"/></symbol>
  <symbol id="i-ball" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="#fff" stroke="#1d2326" stroke-width="1"/><path d="M12 7.3l3.3 2.4-1.3 3.9H10l-1.3-3.9z" fill="#1d2326"/><path d="M12 2.5v4.8M15.3 9.7l4.6-1.5M14 13.6l2.9 4M10 13.6l-2.9 4M8.7 9.7L4.1 8.2" stroke="#1d2326" stroke-width="1"/></symbol>
  <symbol id="i-racket" viewBox="0 0 24 24"><ellipse cx="9.5" cy="8.5" rx="6" ry="7" transform="rotate(-40 9.5 8.5)" fill="none" stroke="#E07B54" stroke-width="2"/><path d="M6 6.5l7 6M8 4.6l6.4 6.1M5 9l5.8 5" stroke="#F2E6D8" stroke-width=".7"/><path d="M13.6 13.4l6.6 6.6" stroke="#2F3A40" stroke-width="2.6" stroke-linecap="round"/><circle cx="19" cy="5" r="2.6" fill="#D9F04A"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5" fill="#E8A252"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill="none" stroke="#C9CED1" stroke-width="2.2"/><circle cx="12" cy="15.3" r="1.5" fill="#5C3A12"/></symbol>
</svg>

<header><span class="pic" id="hpic"></span><h1>StatsFight · giochi <span class="k">(prova)</span></h1></header>
<nav id="tabs">
  <button type="button" data-tab="avatar" aria-pressed="true"><svg><use href="#i-avatar"/></svg>Avatar</button>
  <button type="button" data-tab="foto" aria-pressed="false"><svg><use href="#i-camera"/></svg>Foto</button>
  <button type="button" data-tab="rigori" aria-pressed="false"><svg><use href="#i-ball"/></svg>Rigori</button>
  <button type="button" data-tab="tennis" aria-pressed="false"><svg><use href="#i-racket"/></svg>Tennis</button>
</nav>
<main>
  <section id="t-avatar">
    <div class="card"><canvas id="avprev"></canvas>
      <div class="row" style="margin-top:8px;"><input type="text" id="avname" maxlength="14" placeholder="Nome sulla maglia"><input type="number" id="avnum" min="0" max="99" style="width:80px" placeholder="N."></div>
    </div>
    <div class="cats" id="avcats"></div>
    <div class="card" id="avpanel"></div>
    <div class="card"><div class="lbl">Sblocchi</div><div class="k" id="pgtxt"></div>
      <label class="switch"><input type="checkbox" id="unlockall"> Sblocca tutto (solo per la prova)</label></div>
  </section>
  <section id="t-foto" hidden>
    <div class="card shot"><canvas id="fotocv"></canvas><div class="flash" id="flash"></div></div>
    <div class="lbl">Inquadratura</div><div class="cats" id="fzoom"></div>
    <div class="lbl">Sfondo</div><div class="cats" id="fbg"></div>
    <div class="lbl">Posa</div><div class="cats" id="fpose"></div>
    <div class="lbl">Esultanze</div><div class="cats" id="fwin"></div>
    <div class="row" style="margin-top:10px;"><button class="primary" type="button" id="scatta">Scatta la foto</button><span class="k">Le esultanze si muovono: scatta quando ti piace.</span></div>
    <div class="result" id="fres" hidden><img id="fimg" alt="Foto scattata"><div class="row" style="flex-direction:column;align-items:flex-start;"><button class="primary" type="button" id="fuse">Usa come foto profilo</button><a class="ghost" id="fdl" download="statsight-avatar.png">Scarica</a></div></div>
  </section>
  <section id="t-rigori" hidden>
    <div class="hud"><div><div class="who" id="rme"></div><div class="dots" id="rdme"></div></div><div class="big" id="rsc">0 - 0</div><div style="text-align:right"><div class="who" id="rcpu"></div><div class="dots" id="rdcpu" style="justify-content:flex-end"></div></div></div>
    <div class="ruota">Gira il telefono in verticale per giocare.</div>
    <div class="stage"><canvas id="rcv"></canvas><div class="over" id="rover"></div></div>
    <p class="help" id="rhelp"></p>
  </section>
  <section id="t-tennis" hidden>
    <div class="hud"><div class="who" id="tme"></div><div class="big" id="tsc">0 - 0</div><div class="who" id="tcpu"></div></div>
    <div class="ruota">Gira il telefono in verticale per giocare.</div>
    <div class="stage"><canvas id="tcv"></canvas><div class="over" id="tover"></div></div>
    <p class="help" id="thelp"></p>
  </section>
</main>
<div class="toast" id="toast"></div>
<script src="giochi.js"></script>
<script src="giochi_ui.js"></script>
<script src="giochi_rigori.js"></script>
<script src="giochi_tennis.js"></script>
</body>
</html>
